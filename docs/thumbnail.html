<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body { width: 1500px; height: 1000px; background: #edf0f5; color: #171a33; font-family: "Atkinson Hyperlegible", sans-serif; position: relative; overflow: hidden; }
  .ring { position: absolute; border-radius: 50%; border: 3px solid #4b3fd1; }
  .disc { position: absolute; left: 980px; top: 230px; width: 420px; height: 420px; border-radius: 50%; background: #4b3fd1; }
  .r1 { left: 940px; top: 190px; width: 494px; height: 494px; opacity: .45; }
  .r2 { left: 890px; top: 140px; width: 594px; height: 594px; opacity: .2; }
  .mark { position: absolute; left: 110px; top: 110px; font-family: "Bricolage Grotesque"; font-weight: 800; font-size: 84px; letter-spacing: -3px; }
  h1 { position: absolute; left: 110px; top: 300px; margin: 0; width: 760px; font-family: "Bricolage Grotesque"; font-weight: 800; font-size: 104px; line-height: .98; letter-spacing: -4px; }
  .chips { position: absolute; left: 110px; top: 690px; display: flex; gap: 16px; }
  .chip { background: #171a33; color: #fff; border-radius: 999px; padding: 14px 28px; font-size: 34px; }
  .chip.light { background: #fff; color: #171a33; border: 2px solid #d3d9e6; }
  .foot { position: absolute; left: 110px; bottom: 90px; font-size: 32px; color: #586080; }
</style></head>
<body>
  <div class="ring r2"></div><div class="ring r1"></div><div class="disc"></div>
  <div class="mark">hum</div>
  <h1>Every sound means something.</h1>
  <div class="chips"><span class="chip">Sound: a laugh, 97%</span><span class="chip light">Delighted.</span></div>
  <div class="foot">Names the sound, hints at the meaning. On your device.</div>
</body></html>
